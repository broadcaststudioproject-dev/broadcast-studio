name: Pocket PCR Studio - Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pocket PCR Studio APK
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # --------------------------------------------------
      # 3. Flutter
      # --------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # --------------------------------------------------
      # 4. Flutter Version
      # --------------------------------------------------
      - name: Check Flutter Environment
        run: |
          flutter --version
          dart --version
          java -version

      # --------------------------------------------------
      # 5. Flutter Dependencies
      # --------------------------------------------------
      - name: Get Flutter Dependencies
        run: |
          flutter clean
          flutter pub get

      # --------------------------------------------------
      # 6. Analyze Project
      # --------------------------------------------------
      - name: Flutter Analyze
        run: |
          flutter analyze

      # --------------------------------------------------
      # 7. Build Debug APK
      # --------------------------------------------------
      - name: Build Debug APK
        run: |
          flutter build apk --debug --verbose

      # --------------------------------------------------
      # 8. Rename APK
      # --------------------------------------------------
      - name: Prepare APK
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-debug.apk \
             release/pocket-pcr-studio-debug.apk

      # --------------------------------------------------
      # 9. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-pcr-studio-debug-apk
          path: release/pocket-pcr-studio-debug.apk
          if-no-files-found: error
          retention-days: 30
