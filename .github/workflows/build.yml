name: Pocket PCR Studio - Android Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pocket PCR Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fix Pedro Library Link Safely
        run: |
          sed -i 's/io.github.pedroSG94.RootEncoder:rtmp:2.3.0/com.github.pedroSG94.RootEncoder:library:2.4.2/g' android/app/build.gradle || true
          sed -i 's/io.github.pedroSG94.RootEncoder:library:2.4.2/com.github.pedroSG94.RootEncoder:library:2.4.2/g' android/app/build.gradle || true

      - name: Install Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-pcr-studio-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

