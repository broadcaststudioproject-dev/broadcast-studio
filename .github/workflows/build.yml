name: Pocket PCR Studio - Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pocket PCR Studio APK
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Java 17
      # --------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # --------------------------------------------------
      # 3. Setup Flutter
      # --------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # --------------------------------------------------
      # 4. Verify project files
      # --------------------------------------------------
      - name: Verify Flutter Project
        run: |
          test -f pubspec.yaml && echo "pubspec.yaml found"
          test -d lib && echo "lib/ found"

      # --------------------------------------------------
      # 5. Backup Custom Kotlin Code (Added for Streaming)
      # --------------------------------------------------
      - name: Backup Custom Kotlin Code
        run: |
          echo "బ్యాకప్ తీసుకుంటున్నాను..."
          mkdir -p /tmp/kotlin_backup
          cp -r android/app/src/main/kotlin /tmp/kotlin_backup/ || true

      # --------------------------------------------------
      # 6. Remove old unsupported Android project
      # --------------------------------------------------
      - name: Remove Old Android Project
        run: |
          if [ -d "android" ]; then
            echo "Removing old Android project..."
            rm -rf android
          fi

      # --------------------------------------------------
      # 7. Create fresh supported Android project
      # --------------------------------------------------
      - name: Create Fresh Flutter Android Project
        run: |
          flutter create \
            --platforms=android \
            --org com.example \
            .

      # --------------------------------------------------
      # 8. Restore Kotlin & Inject RootEncoder (Added)
      # --------------------------------------------------
      - name: Restore Kotlin & Inject RootEncoder
        run: |
          echo "మన కస్టమ్ కోడ్ తిరిగి పెడుతున్నాను..."
          rm -rf android/app/src/main/kotlin
          cp -r /tmp/kotlin_backup/kotlin android/app/src/main/ || true

          echo "Jitpack లింక్ కలుపుతున్నాను..."
          sed -i 's/mavenCentral()/mavenCentral()\n        maven { url "https:\/\/jitpack.io" }/g' android/settings.gradle || true
          sed -i 's/mavenCentral()/mavenCentral()\n        maven { url = uri("https:\/\/jitpack.io") }/g' android/settings.gradle.kts || true
          
          echo "Pedro RootEncoder లైబ్రరీ జతచేస్తున్నాను..."
          echo "dependencies { implementation 'com.github.pedroSG94.RootEncoder:library:2.4.2' }" >> android/app/build.gradle || true
          echo -e "\ndependencies {\n    implementation(\"com.github.pedroSG94.RootEncoder:library:2.4.2\")\n}" >> android/app/build.gradle.kts || true

      # --------------------------------------------------
      # 9. Force Java 17 for Gradle
      # --------------------------------------------------
      - name: Configure Gradle Java 17
        run: |
          if ! grep -q "org.gradle.java.home" android/gradle.properties 2>/dev/null; then
            echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties
          fi

      # --------------------------------------------------
      # 10. Get Flutter dependencies
      # --------------------------------------------------
      - name: Install Dependencies
        run: |
          flutter clean
          flutter pub get

      # --------------------------------------------------
      # 11. Build Debug APK
      # --------------------------------------------------
      - name: Build APK
        run: |
          flutter build apk --debug

      # --------------------------------------------------
      # 12. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-pcr-studio-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
