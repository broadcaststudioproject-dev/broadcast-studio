name: Pocket PCR Studio - Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pocket PCR Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Java 17 Manually
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Backup Custom Kotlin Code, Reset Android & Restore
        run: |
          echo "Backing up custom Kotlin files..."
          cp -r android/app/src/main/kotlin /tmp/kotlin_backup || true
          
          echo "Deleting old and corrupted android folder..."
          rm -rf android
          
          echo "Creating 100% fresh android platform..."
          flutter create . --platforms=android

          echo "Restoring custom Kotlin files..."
          rm -rf android/app/src/main/kotlin
          cp -r /tmp/kotlin_backup android/app/src/main/kotlin

          echo "Enabling AndroidX and Jetifier..."
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

          echo "Updating App SDK to 36..."
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle.kts || true
          sed -i 's/flutter.targetSdkVersion/36/g' android/app/build.gradle.kts || true
          
          echo "Adding Jitpack Repository..."
          sed -i 's/mavenCentral()/mavenCentral()\n        maven { url = uri("https:\/\/jitpack.io") }/g' android/settings.gradle.kts || true

          echo "Adding Pedro RTMP Library Dependency..."
          echo "" >> android/app/build.gradle.kts
          echo "dependencies {" >> android/app/build.gradle.kts
          echo "    implementation(\"com.github.pedroSG94.rtmp-rtsp-stream-client-java:rtplibrary:2.2.2\")" >> android/app/build.gradle.kts
          echo "}" >> android/app/build.gradle.kts

      - name: Install Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Patch Plugin SDK Versions
        run: |
          echo "Patching 3rd party plugins to use compileSdk 36..."
          find ~/.pub-cache/ -name "build.gradle" -type f -exec sed -i 's/compileSdkVersion 33/compileSdkVersion 36/g' {} + || true
          find ~/.pub-cache/ -name "build.gradle" -type f -exec sed -i 's/compileSdk 33/compileSdk 36/g' {} + || true
          find /opt/hostedtoolcache/ -name "build.gradle" -type f -exec sed -i 's/compileSdkVersion 33/compileSdkVersion 36/g' {} + || true
          find /opt/hostedtoolcache/ -name "build.gradle" -type f -exec sed -i 's/compileSdk 33/compileSdk 36/g' {} + || true

      - name: Build APK
        run: |
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-pcr-studio-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
