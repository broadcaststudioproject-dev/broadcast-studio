name: Pocket PCR Studio - Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pocket PCR Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Clean & Regenerate Android Project
        run: |
          echo "బ్యాకప్ తీసుకుంటున్నాను..."
          mkdir -p /tmp/android_backup
          cp -r android/app/src/main /tmp/android_backup/ || true
          
          echo "పాత ఆండ్రాయిడ్ ఫోల్డర్ డిలీట్ చేస్తున్నాను..."
          rm -rf android
          
          echo "ఫ్రెష్ ఆండ్రాయిడ్ ప్రాజెక్ట్ క్రియేట్ చేస్తున్నాను..."
          flutter create . --platforms=android
          
          echo "మీ పాత కోడ్ (Kotlin & Manifest) తిరిగి పెడుతున్నాను..."
          cp -r /tmp/android_backup/main/* android/app/src/main/ || true

      - name: Inject Jitpack and RootEncoder Safely
        shell: python
        run: |
          import os

          # 1. Update settings.gradle.kts
          settings = "android/settings.gradle.kts"
          if os.path.exists(settings):
              with open(settings, "r") as f:
                  data = f.read()
              if "jitpack.io" not in data:
                  data = data.replace('mavenCentral()', 'mavenCentral()\n        maven { url = uri("https://jitpack.io") }')
              with open(settings, "w") as f:
                  f.write(data)

          # 2. Update app/build.gradle.kts
          app_build = "android/app/build.gradle.kts"
          if os.path.exists(app_build):
              with open(app_build, "r") as f:
                  data = f.read()
              
              data = data.replace('flutter.compileSdkVersion', '34')
              data = data.replace('flutter.targetSdkVersion', '34')
              
              if "pedroSG94" not in data:
                  data += '\n\ndependencies {\n    implementation("com.github.pedroSG94.RootEncoder:library:2.4.2")\n}\n'
              with open(app_build, "w") as f:
                  f.write(data)

      - name: Install Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-pcr-studio-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
