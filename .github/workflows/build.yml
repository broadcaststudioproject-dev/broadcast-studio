name: Pocket PCR Studio - Android Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pocket PCR Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Auto-Repair Android Project
        run: |
          echo "1. బ్యాకప్ తీసుకుంటున్నాను..."
          cp -r android/app/src/main/kotlin /tmp/kotlin_backup || true
          
          echo "2. పాడైపోయిన ఆండ్రాయిడ్ ఫోల్డర్ డిలీట్ చేస్తున్నాను..."
          rm -rf android
          
          echo "3. ఫ్రెష్ ఆండ్రాయిడ్ ప్రాజెక్ట్ క్రియేట్ చేస్తున్నాను..."
          flutter create . --platforms=android
          
          echo "4. మీ పాత కోడ్ తిరిగి పెడుతున్నాను..."
          rm -rf android/app/src/main/kotlin
          cp -r /tmp/kotlin_backup android/app/src/main/kotlin
          
          echo "5. JitPack లింక్ కలుపుతున్నాను..."
          sed -i 's/mavenCentral()/mavenCentral()\n        maven { url "https:\/\/jitpack.io" }/g' android/settings.gradle || true
          sed -i 's/mavenCentral()/mavenCentral()\n        maven { url = uri("https:\/\/jitpack.io") }/g' android/settings.gradle.kts || true
          
          echo "6. Pedro లైబ్రరీ (2.4.2) యాడ్ చేస్తున్నాను..."
          echo "dependencies { implementation 'com.github.pedroSG94.RootEncoder:library:2.4.2' }" >> android/app/build.gradle || true
          echo -e "\ndependencies {\n    implementation(\"com.github.pedroSG94.RootEncoder:library:2.4.2\")\n}" >> android/app/build.gradle.kts || true

      - name: Install Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-pcr-studio-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
