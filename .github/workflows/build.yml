name: Pocket PCR Studio - Android Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pocket PCR Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: The Ultimate Fix (SDK 36 & JitPack)
        run: |
          echo "1. SDK 36 కి అప్‌గ్రేడ్ చేస్తున్నాను..."
          find android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/compileSdkVersion [0-9][0-9]/compileSdkVersion 36/g' {} + || true
          find android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/compileSdk = [0-9][0-9]/compileSdk = 36/g' {} + || true
          find android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/compileSdk [0-9][0-9]/compileSdk 36/g' {} + || true

          echo "2. JitPack సర్వర్ లింక్ ని అన్ని చోట్లా బలవంతంగా కలుపుతున్నాను..."
          # Groovy ఫైల్స్ కోసం
          find android -type f -name "*.gradle" -exec sed -i 's/mavenCentral()/mavenCentral()\n        maven { url "https:\/\/jitpack.io" }/g' {} + || true
          # Kotlin DSL (.kts) ఫైల్స్ కోసం
          find android -type f -name "*.gradle.kts" -exec sed -i 's/mavenCentral()/mavenCentral()\n        maven { url = uri("https:\/\/jitpack.io") }/g' {} + || true

          echo "3. తప్పుగా ఉన్న పాత లైబ్రరీ పేర్లన్నీ వెతికి కొత్త Pedro లైబ్రరీగా మారుస్తున్నాను..."
          find android/app -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/io.github.pedroSG94.RootEncoder:rtmp:2.3.0/com.github.pedroSG94.RootEncoder:library:2.4.2/g' {} + || true
          find android/app -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/io.github.pedroSG94.RootEncoder:library:2.4.2/com.github.pedroSG94.RootEncoder:library:2.4.2/g' {} + || true
          find android/app -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/com.github.pedroSG94.rtmp-rtsp-stream-client-java:rtplibrary:2.2.2/com.github.pedroSG94.RootEncoder:library:2.4.2/g' {} + || true

      - name: Install Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-pcr-studio-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
