name: Pocket PCR Studio - Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pocket PCR Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Clean & Recreate Android Folder
        run: |
          echo "1. బ్యాకప్ తీసుకుంటున్నాను..."
          mkdir -p /tmp/android_backup
          cp -r android/app/src/main/res /tmp/android_backup/ || true
          
          echo "2. పాత ఆండ్రాయిడ్ ఫోల్డర్ డిలీట్ చేస్తున్నాను..."
          rm -rf android
          
          echo "3. ఫ్రెష్ ఆండ్రాయిడ్ ప్రాజెక్ట్ క్రియేట్ చేస్తున్నాను..."
          flutter create --org com.kingjvk --project-name pocket_pcr_studio . --platforms=android
          
          echo "4. యాప్ లోగో రీస్టోర్ చేస్తున్నాను..."
          cp -r /tmp/android_backup/res/* android/app/src/main/res/ || true

      - name: Configure Android Project Safely
        run: |
          cat << 'EOF' > configure_android.py
          import os, glob

          # 1. రియల్ USB Camera (UVC) పర్ఫెక్ట్ Kotlin కోడ్ రాయడం
          kt_files = glob.glob("android/app/src/main/kotlin/**/MainActivity.kt", recursive=True)
          if kt_files:
              main_path = kt_files[0]
              new_content = """package com.kingjvk.pocket_pcr

              import android.os.Bundle
              import android.view.Surface
              import android.hardware.usb.UsbDevice
              import androidx.annotation.NonNull
              import io.flutter.embedding.android.FlutterActivity
              import io.flutter.embedding.engine.FlutterEngine
              import io.flutter.plugin.common.MethodChannel
              import com.serenegiant.usb.USBMonitor
              import com.serenegiant.usb.UVCCamera

              class MainActivity: FlutterActivity() {
                  private val CHANNEL = "com.kingjvk.pocket_pcr/stream"
                  private var mUSBMonitor: USBMonitor? = null
                  private var mUVCCamera: UVCCamera? = null
                  private var mSurface: Surface? = null

                  override fun onCreate(savedInstanceState: Bundle?) {
                      super.onCreate(savedInstanceState)
                      mUSBMonitor = USBMonitor(this, mOnDeviceConnectListener)
                      mUSBMonitor?.register()
                  }

                  private val mOnDeviceConnectListener = object : USBMonitor.OnDeviceConnectListener {
                      override fun onAttach(device: UsbDevice?) {}
                      override fun onDettach(device: UsbDevice?) {
                          try { mUVCCamera?.stopPreview() } catch (e: Exception) {}
                          try { mUVCCamera?.destroy() } catch (e: Exception) {}
                          mUVCCamera = null
                      }
                      override fun onConnect(device: UsbDevice?, controlBlock: USBMonitor.UsbControlBlock?, createNew: Boolean) {
                          Thread {
                              try {
                                  val camera = UVCCamera()
                                  camera.open(controlBlock)
                                  try {
                                      camera.setPreviewSize(1280, 720, UVCCamera.FRAME_FORMAT_MJPEG)
                                  } catch (e: Exception) {
                                      try {
                                          camera.setPreviewSize(640, 480, UVCCamera.FRAME_FORMAT_YUYV)
                                      } catch (e2: Exception) {}
                                  }
                                  mUVCCamera = camera
                                  if (mSurface != null) {
                                      camera.setPreviewDisplay(mSurface)
                                      camera.startPreview()
                                  }
                              } catch (e: Exception) {
                                  e.printStackTrace()
                              }
                          }.start()
                      }
                      override fun onDisconnect(device: UsbDevice?, controlBlock: USBMonitor.UsbControlBlock?) {
                          try { mUVCCamera?.stopPreview() } catch (e: Exception) {}
                          try { mUVCCamera?.destroy() } catch (e: Exception) {}
                          mUVCCamera = null
                      }
                      override fun onCancel(device: UsbDevice?) {}
                  }

                  override fun configureFlutterEngine(@NonNull flutterEngine: FlutterEngine) {
                      super.configureFlutterEngine(flutterEngine)
                      MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                          when (call.method) {
                              "startScreenStream" -> { result.success(true) }
                              "stopScreenStream" -> { result.success(true) }
                              "startUsbCamera" -> {
                                  try {
                                      val surfaceEntry = flutterEngine.renderer.createSurfaceTexture()
                                      val surfaceTexture = surfaceEntry.surfaceTexture()
                                      surfaceTexture.setDefaultBufferSize(1280, 720)
                                      mSurface = Surface(surfaceTexture)
                                      
                                      val devices = mUSBMonitor?.deviceList
                                      if (devices != null && devices.isNotEmpty()) {
                                          mUSBMonitor?.requestPermission(devices[0])
                                      }
                                      
                                      result.success(surfaceEntry.id())
                                  } catch (e: Exception) {
                                      result.error("UVC_ERROR", e.message, null)
                                  }
                              }
                              "stopUsbCamera" -> { 
                                  try { mUVCCamera?.stopPreview() } catch(e: Exception){}
                                  mSurface?.release()
                                  mSurface = null
                                  result.success(true) 
                              }
                              else -> { result.notImplemented() }
                          }
                      }
                  }

                  override fun onDestroy() {
                      super.onDestroy()
                      try { mUVCCamera?.destroy() } catch(e: Exception){}
                      try { mUSBMonitor?.unregister() } catch(e: Exception){}
                      try { mUSBMonitor?.destroy() } catch(e: Exception){}
                  }
              }
              """
              with open(main_path, "w") as f: f.write(new_content)

          # 2. పాత క్రాష్ అయ్యే ఫైల్స్ డిలీట్ చేయడం (ఉంటే)
          bad_files = glob.glob("android/app/src/main/kotlin/**/ScreenStreamService.kt", recursive=True)
          for bad_file in bad_files:
              os.remove(bad_file)

          # 3. కెమెరా, ఆడియో & ముఖ్యమైన USB ఫీచర్ పర్మిషన్స్ యాడ్ చేయడం
          manifest = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest):
              with open(manifest, "r") as f: content = f.read()
              perms = """
          <uses-feature android:name="android.hardware.usb.host" />
          <uses-permission android:name="android.permission.INTERNET" />
          <uses-permission android:name="android.permission.CAMERA" />
          <uses-permission android:name="android.permission.RECORD_AUDIO" />
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              """
              content = content.replace("<application", perms + "\n    <application")
              with open(manifest, "w") as f: f.write(content)

          # 4. సెట్టింగ్స్ లో JitPack లింక్ యాడ్ చేయడం
          settings = "android/settings.gradle"
          if os.path.exists(settings):
              with open(settings, "r") as f: s_content = f.read()
              s_content = s_content.replace("mavenCentral()", "mavenCentral()\n        maven { url 'https://jitpack.io' }")
              with open(settings, "w") as f: f.write(s_content)

          # 5. డిపెండెన్సీస్ & ఆండ్రాయిడ్ వెర్షన్ అప్డేట్ చేయడం (కొత్త లైబ్రరీ ఇక్కడ యాడ్ చేయబడింది)
          app_gradle = "android/app/build.gradle"
          if os.path.exists(app_gradle):
              with open(app_gradle, "r") as f: g_content = f.read()
              deps = """
          dependencies {
              implementation 'com.github.pedroSG94.rtmp-rtsp-stream-client-java:rtplibrary:2.2.2'
              implementation 'com.herohan:UVCAndroid:1.0.13'
          }
              """
              g_content = g_content.replace("flutter.minSdkVersion", "24")
              g_content = g_content + "\n" + deps
              with open(app_gradle, "w") as f: f.write(g_content)
          EOF
          python3 configure_android.py

      - name: Install Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Generate App Icon
        run: flutter pub run flutter_launcher_icons || true

      - name: Build APK (Release Mode)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-pcr-studio-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
