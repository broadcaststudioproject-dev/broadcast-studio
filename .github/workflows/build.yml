name: Pocket PCR Studio - Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pocket PCR Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Java 17 Manually
        run: |
          echo "Installing Java 17 via apt..."
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          java -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Fresh Android Template & Write Clean Build Gradle
        run: |
          echo "Generating standard Flutter Android template..."
          flutter create . --platforms=android

          echo "Writing clean and supported android/app/build.gradle..."
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-plugin-loader"
          }

          android {
              namespace "com.example.pocket_pcr_studio"
              compileSdkVersion flutter.compileSdkVersion
              compileSdk flutter.compileSdkVersion

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = '1.8'
              }

              defaultConfig {
                  applicationId "com.example.pocket_pcr_studio"
                  minSdk 24
                  targetSdk flutter.targetSdkVersion
                  versionCode flutter.versionCode.toInteger()
                  versionName flutter.versionName
                  multiDexEnabled true
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }

          flutter {
              source = "../.."
          }

          dependencies {
              implementation 'io.github.pedroSG94.RootEncoder:rtmp:2.3.0'
              implementation 'androidx.multidex:multidex:2.0.1'
          }
          EOF

      - name: Clean and Get Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: |
          flutter build apk --debug --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-pcr-studio-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
