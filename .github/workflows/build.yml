name: Pocket PCR Studio - Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pocket PCR Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Clean & Recreate Android Folder
        run: |
          echo "1. బ్యాకప్ తీసుకుంటున్నాను..."
          mkdir -p /tmp/android_backup
          cp -r android/app/src/main/res /tmp/android_backup/ || true
          
          echo "2. పాత ఆండ్రాయిడ్ ఫోల్డర్ డిలీట్ చేస్తున్నాను..."
          rm -rf android
          
          echo "3. ఫ్రెష్ ఆండ్రాయిడ్ ప్రాజెక్ట్ క్రియేట్ చేస్తున్నాను..."
          flutter create --org com.kingjvk --project-name pocket_pcr_studio . --platforms=android
          
          echo "4. యాప్ లోగో రీస్టోర్ చేస్తున్నాను..."
          cp -r /tmp/android_backup/res/* android/app/src/main/res/ || true

      - name: Configure Android Project Safely
        run: |
          cat << 'EOF' > configure_android.py
          import os, glob, shutil, re

          # 1. పాత Kotlin ఫైల్స్ తొలగించడం
          kt_dir = "android/app/src/main/kotlin"
          if os.path.exists(kt_dir):
              shutil.rmtree(kt_dir)

          # 2. రియల్ USB Camera (UVC) పర్ఫెక్ట్ JAVA కోర్ కోడ్
          java_dir = "android/app/src/main/java/com/kingjvk/pocket_pcr"
          os.makedirs(java_dir, exist_ok=True)
          java_path = os.path.join(java_dir, "MainActivity.java")
          
          new_content = """package com.kingjvk.pocket_pcr;

          import android.os.Bundle;
          import android.view.Surface;
          import android.hardware.usb.UsbDevice;
          import androidx.annotation.NonNull;
          import io.flutter.embedding.android.FlutterActivity;
          import io.flutter.embedding.engine.FlutterEngine;
          import io.flutter.plugin.common.MethodChannel;
          import io.flutter.view.TextureRegistry;

          import com.serenegiant.usb.USBMonitor;
          import com.serenegiant.usb.UVCCamera;

          public class MainActivity extends FlutterActivity {
              private static final String CHANNEL = "com.kingjvk.pocket_pcr/stream";
              private USBMonitor mUSBMonitor;
              private UVCCamera mUVCCamera;
              private Surface mSurface;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  mUSBMonitor = new USBMonitor(this, mOnDeviceConnectListener);
                  mUSBMonitor.register();
              }

              private final USBMonitor.OnDeviceConnectListener mOnDeviceConnectListener = new USBMonitor.OnDeviceConnectListener() {
                  @Override
                  public void onAttach(UsbDevice device) {}

                  @Override
                  public void onDettach(UsbDevice device) {
                      if (mUVCCamera != null) {
                          mUVCCamera.stopPreview();
                          mUVCCamera.destroy();
                          mUVCCamera = null;
                      }
                  }

                  @Override
                  public void onConnect(UsbDevice device, USBMonitor.UsbControlBlock controlBlock, boolean createNew) {
                      new Thread(() -> {
                          try {
                              UVCCamera camera = new UVCCamera();
                              camera.open(controlBlock);
                              try {
                                  camera.setPreviewSize(1280, 720, UVCCamera.FRAME_FORMAT_MJPEG);
                              } catch (Exception e) {
                                  try {
                                      camera.setPreviewSize(640, 480, UVCCamera.FRAME_FORMAT_YUYV);
                                  } catch (Exception e2) {}
                              }
                              mUVCCamera = camera;
                              if (mSurface != null) {
                                  camera.setPreviewDisplay(mSurface);
                                  camera.startPreview();
                              }
                          } catch (Exception e) {
                              e.printStackTrace();
                          }
                      }).start();
                  }

                  @Override
                  public void onDisconnect(UsbDevice device, USBMonitor.UsbControlBlock controlBlock) {
                      if (mUVCCamera != null) {
                          mUVCCamera.stopPreview();
                          mUVCCamera.destroy();
                          mUVCCamera = null;
                      }
                  }

                  @Override
                  public void onCancel(UsbDevice device) {}
              };

              @Override
              public void configureFlutterEngine(@NonNull FlutterEngine flutterEngine) {
                  super.configureFlutterEngine(flutterEngine);
                  new MethodChannel(flutterEngine.getDartExecutor().getBinaryMessenger(), CHANNEL)
                      .setMethodCallHandler((call, result) -> {
                          switch (call.method) {
                              case "startScreenStream":
                              case "stopScreenStream":
                                  result.success(true);
                                  break;
                              case "startUsbCamera":
                                  try {
                                      TextureRegistry.SurfaceTextureEntry surfaceEntry = flutterEngine.getRenderer().createSurfaceTexture();
                                      android.graphics.SurfaceTexture surfaceTexture = surfaceEntry.surfaceTexture();
                                      surfaceTexture.setDefaultBufferSize(1280, 720);
                                      mSurface = new Surface(surfaceTexture);
                                      
                                      if (mUSBMonitor != null) {
                                          java.util.List<UsbDevice> devices = mUSBMonitor.getDeviceList();
                                          if (devices != null && !devices.isEmpty()) {
                                              mUSBMonitor.requestPermission(devices.get(0));
                                          }
                                      }
                                      
                                      result.success(surfaceEntry.id());
                                  } catch (Exception e) {
                                      result.error("UVC_ERROR", e.getMessage(), null);
                                  }
                                  break;
                              case "stopUsbCamera":
                                  if (mUVCCamera != null) {
                                      mUVCCamera.stopPreview();
                                  }
                                  if (mSurface != null) {
                                      mSurface.release();
                                      mSurface = null;
                                  }
                                  result.success(true);
                                  break;
                              default:
                                  result.notImplemented();
                                  break;
                          }
                      });
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  if (mUVCCamera != null) {
                      mUVCCamera.destroy();
                  }
                  if (mUSBMonitor != null) {
                      mUSBMonitor.unregister();
                      mUSBMonitor.destroy();
                  }
              }
          }
          """
          with open(java_path, "w") as f: f.write(new_content)

          # 3. పాత క్రాష్ అయ్యే ఫైల్స్ డిలీట్ చేయడం
          bad_files = glob.glob("android/app/src/main/kotlin/**/ScreenStreamService.kt", recursive=True)
          for bad_file in bad_files:
              os.remove(bad_file)

          # 4. పర్మిషన్స్
          manifest = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest):
              with open(manifest, "r") as f: content = f.read()
              perms = """
          <uses-feature android:name="android.hardware.usb.host" />
          <uses-permission android:name="android.permission.INTERNET" />
          <uses-permission android:name="android.permission.CAMERA" />
          <uses-permission android:name="android.permission.RECORD_AUDIO" />
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              """
              content = content.replace("<application", perms + "\n    <application")
              with open(manifest, "w") as f: f.write(content)

          # 5. JitPack లింక్ కరెక్ట్ గా యాడ్ చేయడం
          settings_file = "android/settings.gradle"
          if os.path.exists(settings_file):
              with open(settings_file, "r") as f: s_content = f.read()
              s_content = re.sub(r'(repositories\s*\{)', r'\1\n        maven { url "https://jitpack.io" }', s_content)
              with open(settings_file, "w") as f: f.write(s_content)
              
          build_file = "android/build.gradle"
          if os.path.exists(build_file):
              with open(build_file, "a") as f:
                  f.write("\nallprojects { repositories { maven { url 'https://jitpack.io' } } }\n")

          # 6. సరియైన herohan లైబ్రరీ లింక్ తో డిపెండెన్సీస్ యాడ్ చేయడం 
          app_gradle = "android/app/build.gradle"
          if os.path.exists(app_gradle):
              with open(app_gradle, "r") as f: g_content = f.read()
              deps = """
          dependencies {
              implementation 'com.github.pedroSG94.rtmp-rtsp-stream-client-java:rtplibrary:2.2.2'
              implementation 'com.github.herohan:UVCAndroid:1.0.22'
          }
              """
              g_content = g_content.replace("flutter.minSdkVersion", "24")
              g_content = g_content + "\n" + deps
              with open(app_gradle, "w") as f: f.write(g_content)
          EOF
          python3 configure_android.py

      - name: Install Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Generate App Icon
        run: flutter pub run flutter_launcher_icons || true

      - name: Build APK (Release Mode)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-pcr-studio-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
