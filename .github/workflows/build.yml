name: Pocket PCR Studio - Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pocket PCR Studio APK
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. JAVA
      # ---------------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------
      # 3. FLUTTER
      # ---------------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ---------------------------------------------------------
      # 4. GENERATE SUPPORTED ANDROID PROJECT TEMPLATE
      # ---------------------------------------------------------
      - name: Generate Fresh Android Project
        run: |
          echo "Generating standard Flutter Android template..."
          flutter create . --platforms=android

      # ---------------------------------------------------------
      # 5. INJECT CUSTOM BUILD.GRADLE WITH RTMP DEPENDENCY
      # ---------------------------------------------------------
      - name: Configure Android App Build Gradle
        run: |
          echo "Injecting custom build.gradle configurations..."
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-plugin-loader"
          }

          android {
              namespace "com.example.pocket_pcr_studio"
              compileSdk flutter.compileSdkVersion
              ndkVersion "28.2.13676358"

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = '1.8'
              }

              defaultConfig {
                  applicationId "com.example.pocket_pcr_studio"
                  minSdk 24
                  targetSdk flutter.targetSdkVersion
                  versionCode flutter.versionCode.toInteger()
                  versionName flutter.versionName
                  multiDexEnabled true
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }

          flutter {
              source = "../.."
          }

          dependencies {
              implementation 'io.github.pedroSG94.RootEncoder:rtmp:2.3.0'
              implementation 'androidx.multidex:multidex:2.0.1'
          }
          EOF

      # ---------------------------------------------------------
      # 6. CLEAN & GET DEPENDENCIES
      # ---------------------------------------------------------
      - name: Install Dependencies
        run: |
          flutter clean
          flutter pub get

      # ---------------------------------------------------------
      # 7. BUILD APK
      # ---------------------------------------------------------
      - name: Build APK
        run: |
          echo "=================================================="
          echo "BUILDING POCKET PCR STUDIO APK"
          echo "=================================================="

          flutter build apk \
            --debug \
            --verbose

      # ---------------------------------------------------------
      # 8. UPLOAD APK
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-pcr-studio-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      # ---------------------------------------------------------
      # 9. BUILD SUMMARY
      # ---------------------------------------------------------
      - name: Build Summary
        if: success()
        run: |
          echo "=================================================="
          echo "       POCKET PCR STUDIO BUILD SUCCESS"
          echo "=================================================="
          echo "APK: build/app/outputs/flutter-apk/app-debug.apk"
          echo "=================================================="
