name: Pocket PCR Studio - Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pocket PCR Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Clean & Rebuild Android Folder
        run: |
          echo "1. బ్యాకప్ తీసుకుంటున్నాను..."
          mkdir -p /tmp/kotlin_backup
          cp -r android/app/src/main/kotlin /tmp/kotlin_backup/ || true
          
          echo "2. కరప్ట్ అయిన పాత ఆండ్రాయిడ్ ఫోల్డర్ డిలీట్ చేస్తున్నాను..."
          rm -rf android
          
          echo "3. ఫ్రెష్ ఆండ్రాయిడ్ ప్రాజెక్ట్ క్రియేట్ చేస్తున్నాను..."
          flutter create . --platforms=android
          
          echo "4. మీ కస్టమ్ కోడ్ (ScreenStreamService) రీస్టోర్ చేస్తున్నాను..."
          rm -rf android/app/src/main/kotlin
          cp -r /tmp/kotlin_backup/kotlin android/app/src/main/ || true

      - name: Safe Patch Gradle Files (Python Engine)
        shell: python
        run: |
          import os

          # A. Fix settings.gradle to add JitPack
          settings_path = 'android/settings.gradle'
          is_kts = False
          if not os.path.exists(settings_path):
              settings_path = 'android/settings.gradle.kts'
              is_kts = True
          
          with open(settings_path, 'r') as f:
              settings = f.read()
          
          if 'jitpack.io' not in settings:
              if is_kts:
                  settings = settings.replace('mavenCentral()', 'mavenCentral()\n        maven { url = uri("https://jitpack.io") }')
              else:
                  settings = settings.replace('mavenCentral()', 'mavenCentral()\n        maven { url "https://jitpack.io" }')
              with open(settings_path, 'w') as f:
                  f.write(settings)
          
          # B. Fix app/build.gradle to add RootEncoder & upgrade SDK 36
          app_gradle = 'android/app/build.gradle'
          is_app_kts = False
          if not os.path.exists(app_gradle):
              app_gradle = 'android/app/build.gradle.kts'
              is_app_kts = True
              
          with open(app_gradle, 'r') as f:
              app_build = f.read()

          # Upgrade SDK to 36
          app_build = app_build.replace('flutter.compileSdkVersion', '36')
          app_build = app_build.replace('flutter.targetSdkVersion', '36')

          # Add dependencies
          pedro_dep = 'implementation("com.github.pedroSG94.RootEncoder:library:2.4.2")' if is_app_kts else "implementation 'com.github.pedroSG94.RootEncoder:library:2.4.2'"
          
          if 'dependencies {' in app_build:
              app_build = app_build.replace('dependencies {', f'dependencies {{\n    {pedro_dep}')
          else:
              app_build += f"\ndependencies {{\n    {pedro_dep}\n}}\n"

          with open(app_gradle, 'w') as f:
              f.write(app_build)

      - name: Install Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-pcr-studio-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
