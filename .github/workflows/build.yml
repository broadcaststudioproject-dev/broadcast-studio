name: Pocket PCR Studio - Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pocket PCR Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Clean & Rebuild Android Folder
        run: |
          echo "1. బ్యాకప్ తీసుకుంటున్నాను..."
          mkdir -p /tmp/kotlin_backup
          cp -r android/app/src/main/kotlin /tmp/kotlin_backup/ || true
          
          echo "2. పాత ఆండ్రాయిడ్ ఫోల్డర్ డిలీట్ చేస్తున్నాను..."
          rm -rf android
          
          echo "3. ఫ్రెష్ ఆండ్రాయిడ్ ప్రాజెక్ట్ క్రియేట్ చేస్తున్నాను..."
          flutter create . --platforms=android
          
          echo "4. మీ కస్టమ్ కోడ్ (ScreenStreamService) రీస్టోర్ చేస్తున్నాను..."
          rm -rf android/app/src/main/kotlin
          cp -r /tmp/kotlin_backup/kotlin android/app/src/main/ || true

      - name: Brute Force Inject JitPack & RootEncoder
        run: |
          echo "JitPack ను అన్ని ప్రాజెక్టులకు బలవంతంగా అప్లై చేస్తున్నాను..."
          if [ -f "android/build.gradle.kts" ]; then
            echo "" >> android/build.gradle.kts
            echo "allprojects { repositories { maven { url = uri(\"https://jitpack.io\") } } }" >> android/build.gradle.kts
          elif [ -f "android/build.gradle" ]; then
            echo "" >> android/build.gradle
            echo "allprojects { repositories { maven { url 'https://jitpack.io' } } }" >> android/build.gradle
          fi

          echo "RootEncoder లైబ్రరీ యాడ్ చేస్తున్నాను..."
          if [ -f "android/app/build.gradle.kts" ]; then
            echo "" >> android/app/build.gradle.kts
            echo "dependencies { implementation(\"com.github.pedroSG94.RootEncoder:library:2.4.2\") }" >> android/app/build.gradle.kts
          elif [ -f "android/app/build.gradle" ]; then
            echo "" >> android/app/build.gradle
            echo "dependencies { implementation 'com.github.pedroSG94.RootEncoder:library:2.4.2' }" >> android/app/build.gradle
          fi

          echo "SDK 36 కి అప్‌గ్రేడ్ చేస్తున్నాను..."
          find android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/flutter.compileSdkVersion/36/g' {} + || true

      - name: Install Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-pcr-studio-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
