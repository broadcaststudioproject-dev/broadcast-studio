name: Pocket PCR Studio - Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pocket PCR Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Java 17 Manually
        run: |
          echo "Installing Java 17..."
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          java -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Official Android Template & Configure Dependencies
        run: |
          echo "Generating official Flutter Android template..."
          flutter create . --platforms=android

          echo "Adding JitPack repository to android/settings.gradle..."
          sed -i "/repositories {/a \        maven { url 'https://jitpack.io' }" android/settings.gradle

          echo "Enabling MultiDex and adding RTMP dependency to android/app/build.gradle..."
          sed -i '/defaultConfig {/a \        multiDexEnabled true' android/app/build.gradle

          echo "" >> android/app/build.gradle
          echo "dependencies {" >> android/app/build.gradle
          echo "    implementation 'io.github.pedroSG94.RootEncoder:rtmp:2.3.0'" >> android/app/build.gradle
          echo "    implementation 'androidx.multidex:multidex:2.0.1'" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle

      - name: Clean and Get Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: |
          flutter build apk --debug --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-pcr-studio-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
