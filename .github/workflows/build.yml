name: Pocket PCR Studio - Master Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pocket PCR Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # గమనిక: మీ పాత ఆండ్రాయిడ్ ఫోల్డర్‌ను తొలగించి, Java ప్రాజెక్ట్‌ను 
      # క్రియేట్ చేసే 'Clean & Recreate Android Folder' దశ ఇక్కడ నుండి తొలగించబడింది.

      - name: Configure Android Project (Dependencies & Manifest)
        shell: bash
        run: |
          cat > configure_android.py <<'PYTHON'
          import glob
          import os

          # గమనిక: MainActivity.java సృష్టించే హానికరమైన కోడ్ ఇక్కడ నుండి పూర్తిగా తొలగించబడింది.
          # మీ రిపోజిటరీలో ఉన్న అసలు MainActivity.kt (Kotlin) ఫైల్ మాత్రమే ఇకపై ఉపయోగించబడుతుంది.

          manifest = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest):
              with open(manifest, "r", encoding="utf-8") as f:
                  content = f.read()

              permissions = [
                  '<uses-feature android:name="android.hardware.usb.host" android:required="false" />',
                  '<uses-permission android:name="android.permission.INTERNET" />',
                  '<uses-permission android:name="android.permission.CAMERA" />',
                  '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
                  '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
                  '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />',
                  '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
              ]

              missing = [
                  p for p in permissions
                  if p.split()[1] not in content
              ]

              if missing:
                  first_app = content.find("<application")
                  if first_app >= 0:
                      content = (
                          content[:first_app]
                          + "\n    "
                          + "\n    ".join(missing)
                          + "\n\n    "
                          + content[first_app:]
                      )

              if 'android:name="flutterEmbedding"' not in content:
                  meta = (
                      '<meta-data android:name="flutterEmbedding" '
                      'android:value="2" />'
                  )
                  content = content.replace(
                      "</application>",
                      "        " + meta + "\n    </application>"
                  )

              with open(manifest, "w", encoding="utf-8") as f:
                  f.write(content)

          with open("android/app/proguard-rules.pro", "a", encoding="utf-8") as f:
              f.write(
                  "\n-keep class com.serenegiant.** { *; }\n"
                  "-keep class com.herohan.** { *; }\n"
              )

          for fpath in glob.glob("android/**/*.gradle*", recursive=True):
              try:
                  with open(fpath, "r", encoding="utf-8") as f:
                      txt = f.read()

                  if "jitpack.io" not in txt and "mavenCentral()" in txt:
                      if fpath.endswith(".kts"):
                          txt = txt.replace(
                              "mavenCentral()",
                              'mavenCentral()\n'
                              '        maven { url = uri("https://jitpack.io") }'
                          )
                      else:
                          txt = txt.replace(
                              "mavenCentral()",
                              "mavenCentral()\n"
                              "        maven { url 'https://jitpack.io' }"
                          )

                      with open(fpath, "w", encoding="utf-8") as f:
                          f.write(txt)

              except Exception as e:
                  print(f"WARNING: Could not update repository in {fpath}: {e}")

          def setup_app_gradle(filepath, deps_block):
              if not os.path.exists(filepath):
                  return

              with open(filepath, "r", encoding="utf-8") as f:
                  txt = f.read()

              txt = txt.replace("flutter.minSdkVersion", "24")

              if "UVCAndroid" not in txt:
                  txt += "\n" + deps_block + "\n"

              with open(filepath, "w", encoding="utf-8") as f:
                  f.write(txt)

          deps_gr = """dependencies {
              implementation 'com.github.pedroSG94.rtmp-rtsp-stream-client-java:rtplibrary:2.2.2'
              implementation 'com.herohan:UVCAndroid:1.0.13'
          }
          """

          deps_kts = """dependencies {
              implementation("com.github.pedroSG94.rtmp-rtsp-stream-client-java:rtplibrary:2.2.2")
              implementation("com.herohan:UVCAndroid:1.0.13")
          }
          """

          setup_app_gradle("android/app/build.gradle", deps_gr)
          setup_app_gradle("android/app/build.gradle.kts", deps_kts)

          print("Android dependency and manifest configuration completed.")
          PYTHON
          python3 configure_android.py

      - name: Install Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Generate App Icon
        run: flutter pub run flutter_launcher_icons || true

      - name: Build APK (Release Mode)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-pcr-studio-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
