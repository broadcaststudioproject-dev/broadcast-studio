name: Pocket PCR Studio - Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pocket PCR Studio APK
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. JAVA
      # ---------------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------
      # 3. FLUTTER
      # ---------------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ---------------------------------------------------------
      # 4. SHOW ENVIRONMENT
      # ---------------------------------------------------------
      - name: Show Build Environment
        run: |
          echo "=================================================="
          echo "POCKET PCR STUDIO BUILD ENVIRONMENT"
          echo "=================================================="
          flutter --version
          dart --version
          java -version

      # ---------------------------------------------------------
      # 5. GENERATE & ENSURE ANDROID PLATFORM FILES
      # ---------------------------------------------------------
      - name: Generate Android Platform Files
        run: |
          echo "Ensuring Android platform files exist..."
          flutter create . --platforms=android

      # ---------------------------------------------------------
      # 6. FLUTTER CLEAN
      # ---------------------------------------------------------
      - name: Clean Project Cache
        run: |
          flutter clean
          rm -rf build
          rm -rf .dart_tool

      # ---------------------------------------------------------
      # 7. GET DEPENDENCIES
      # ---------------------------------------------------------
      - name: Install Dependencies
        run: |
          flutter pub get

      # ---------------------------------------------------------
      # 8. BUILD APK
      # ---------------------------------------------------------
      - name: Build APK
        run: |
          echo "=================================================="
          echo "BUILDING POCKET PCR STUDIO APK"
          echo "=================================================="

          flutter build apk \
            --debug \
            --android-skip-build-dependency-validation \
            --verbose

      # ---------------------------------------------------------
      # 9. UPLOAD APK
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-pcr-studio-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      # ---------------------------------------------------------
      # 10. BUILD SUMMARY
      # ---------------------------------------------------------
      - name: Build Summary
        if: success()
        run: |
          echo "=================================================="
          echo "       POCKET PCR STUDIO BUILD SUCCESS"
          echo "=================================================="
          echo "APK: build/app/outputs/flutter-apk/app-debug.apk"
          echo "=================================================="
