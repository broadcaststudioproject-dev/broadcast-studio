name: Pocket PCR Studio - Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pocket PCR Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Java 17 Manually
        run: |
          echo "Installing Java 17 via apt to avoid setup-java bug..."
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          java -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Fresh Android Template & Add Dependencies
        run: |
          flutter create . --platforms=android
          
          # Enable multidex
          sed -i '/defaultConfig {/a \        multiDexEnabled true' android/app/build.gradle
          
          # Add required dependencies safely
          echo "dependencies {" >> android/app/build.gradle
          echo "    implementation 'io.github.pedroSG94.RootEncoder:rtmp:2.3.0'" >> android/app/build.gradle
          echo "    implementation 'androidx.multidex:multidex:2.0.1'" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle

      - name: Clean and Get Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: |
          flutter build apk --debug --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-pcr-studio-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
