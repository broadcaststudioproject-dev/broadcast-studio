name: Pocket PCR Studio - Master Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pocket PCR Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6' 
          cache: true

      - name: Configure Android Project (Fix Duplicate Classes Ver 2)
        shell: bash
        run: |
          cat > configure_android.py <<'PYTHON'
          import glob
          import os
          import re

          # 1. SETTINGS.GRADLE
          if os.path.exists("android/settings.gradle.kts"):
              os.remove("android/settings.gradle.kts")

          settings_path = "android/settings.gradle"
          settings_content = """pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null: "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.1.0" apply false
              id "org.jetbrains.kotlin.android" version "1.8.22" apply false
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://storage.googleapis.com/download.flutter.io" }
                  maven { url "https://jitpack.io" }
              }
          }

          include ":app"
          """
          with open(settings_path, "w", encoding="utf-8") as f:
              f.write(settings_content)

          # 2. Manifest Permissions
          manifest = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest):
              with open(manifest, "r", encoding="utf-8") as f:
                  content = f.read()

              permissions = [
                  '<uses-feature android:name="android.hardware.usb.host" android:required="false" />',
                  '<uses-permission android:name="android.permission.INTERNET" />',
                  '<uses-permission android:name="android.permission.CAMERA" />',
                  '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
                  '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
                  '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />',
                  '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
              ]

              missing = [p for p in permissions if p.split()[1] not in content]

              if missing:
                  first_app = content.find("<application")
                  if first_app >= 0:
                      content = content[:first_app] + "\n    " + "\n    ".join(missing) + "\n\n    " + content[first_app:]

              if 'android:name="flutterEmbedding"' not in content:
                  meta = '<meta-data android:name="flutterEmbedding" android:value="2" />'
                  content = content.replace("</application>", "        " + meta + "\n    </application>")

              with open(manifest, "w", encoding="utf-8") as f:
                  f.write(content)

          # 3. Proguard Rules
          with open("android/app/proguard-rules.pro", "a", encoding="utf-8") as f:
              f.write("\n-keep class com.serenegiant.** { *; }\n-keep class com.herohan.** { *; }\n")
              
          # 4. Update existing repos
          for fpath in glob.glob("android/**/*.gradle*", recursive=True):
              try:
                  with open(fpath, "r", encoding="utf-8") as f:
                      txt = f.read()

                  if "jitpack.io" not in txt and "mavenCentral()" in txt:
                      if fpath.endswith(".kts"):
                          txt = txt.replace("mavenCentral()", 'mavenCentral()\n        maven { url = uri("https://jitpack.io") }')
                      else:
                          txt = txt.replace("mavenCentral()", "mavenCentral()\n        maven { url 'https://jitpack.io' }")

                      with open(fpath, "w", encoding="utf-8") as f:
                          f.write(txt)
              except Exception as e:
                  pass

          # 5. App Gradle Dependencies (Reverted to compatible 2.2.2 version)
          def setup_app_gradle(filepath, deps_block):
              if not os.path.exists(filepath): return
              with open(filepath, "r", encoding="utf-8") as f:
                  txt = f.read()
              
              txt = re.sub(r"(?m)^.*jiangdongguo.*$\n?", "", txt)
              txt = re.sub(r"(?m)^.*pedroSG94.*$\n?", "", txt)
              txt = re.sub(r"(?m)^.*UVCAndroid.*$\n?", "", txt)
              
              txt = txt.replace("flutter.minSdkVersion", "24")
              txt = txt.replace("flutter.targetSdkVersion", "34")
              txt = txt.replace("flutter.compileSdkVersion", "34")
              txt = txt.replace("flutter.versionCode", "1")
              txt = txt.replace("flutter.versionName", '"1.0.0"')
              
              txt += "\n" + deps_block + "\n"
              
              with open(filepath, "w", encoding="utf-8") as f:
                  f.write(txt)

          deps_gr = "dependencies {\n    implementation 'com.github.pedroSG94.rtmp-rtsp-stream-client-java:rtplibrary:2.2.2'\n    implementation 'com.herohan:UVCAndroid:1.0.13'\n}\n"
          deps_kts = 'dependencies {\n    implementation("com.github.pedroSG94.rtmp-rtsp-stream-client-java:rtplibrary:2.2.2")\n    implementation("com.herohan:UVCAndroid:1.0.13")\n}\n'

          setup_app_gradle("android/app/build.gradle", deps_gr)
          setup_app_gradle("android/app/build.gradle.kts", deps_kts)

          print("Configuration Applied Successfully.")
          PYTHON
          python3 configure_android.py

      - name: Install Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons || true

      - name: Build APK (Release Mode)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-pcr-studio-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
