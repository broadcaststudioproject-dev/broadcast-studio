name: Pocket PCR Studio - Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pocket PCR Studio APK
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Checkout Source Code
      # ==================================================
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ==================================================
      # 2. Setup Java 17
      # ==================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ==================================================
      # 3. Setup Flutter
      # ==================================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ==================================================
      # 4. Check Environment
      # ==================================================
      - name: Check Build Environment
        run: |
          echo "======================================"
          echo "POCKET PCR STUDIO BUILD ENVIRONMENT"
          echo "======================================"

          echo ""
          echo "Flutter:"
          flutter --version

          echo ""
          echo "Dart:"
          dart --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Java Home:"
          echo "$JAVA_HOME"

          echo ""
          echo "Working Directory:"
          pwd

      # ==================================================
      # 5. Verify Project Structure
      # ==================================================
      - name: Verify Flutter Project
        run: |
          echo "Checking Flutter project..."

          if [ ! -f "pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          if [ ! -d "android" ]; then
            echo "ERROR: android directory not found."
            exit 1
          fi

          if [ ! -d "lib" ]; then
            echo "ERROR: lib directory not found."
            exit 1
          fi

          echo ""
          echo "Flutter project structure:"
          echo "OK - pubspec.yaml"
          echo "OK - android/"
          echo "OK - lib/"

      # ==================================================
      # 6. Check for Dangerous Nested Repository
      # ==================================================
      - name: Check Repository Structure
        run: |
          echo "Checking repository structure..."

          echo ""
          echo "Top-level directories:"
          find . -maxdepth 2 -type d \
            -not -path "./.git*" \
            -print | sort | head -100

          echo ""
          echo "Checking symbolic links..."

          find . -type l \
            -not -path "./.git/*" \
            -print || true

          echo ""
          echo "Repository structure check completed."

      # ==================================================
      # 7. Flutter Pub Get
      # ==================================================
      - name: Flutter Pub Get
        run: |
          flutter pub get

      # ==================================================
      # 8. Flutter Analyze
      # ==================================================
      - name: Flutter Analyze
        run: |
          flutter analyze

      # ==================================================
      # 9. Clean Flutter Build
      # ==================================================
      - name: Flutter Clean
        run: |
          flutter clean
          flutter pub get

      # ==================================================
      # 10. Build Debug APK
      # ==================================================
      - name: Build Debug APK
        run: |
          flutter build apk --debug --verbose

      # ==================================================
      # 11. Verify APK
      # ==================================================
      - name: Verify APK
        run: |
          echo "======================================"
          echo "APK BUILD RESULT"
          echo "======================================"

          APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "APK successfully created:"
          echo "$APK_PATH"

          echo ""
          echo "APK size:"
          du -h "$APK_PATH"

          echo ""
          echo "APK SHA256:"
          sha256sum "$APK_PATH"

      # ==================================================
      # 12. Upload APK Artifact
      # ==================================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-pcr-studio-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
