plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin" 
}

android {
    namespace "com.kingjvr.pocket_pcr" 
    compileSdk 34
    ndkVersion "28.2.13676358"

    compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
}

kotlinOptions {
    jvmTarget = '17'
}

    defaultConfig {
        applicationId "com.kingjvr.pocket_pcr" // JVR నుండి JVK కి మార్చబడింది
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true

        // C++ కోడ్ బిల్డ్ అవ్వడానికి అవసరమైన CMake కాన్ఫిగరేషన్
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                // ఇక్కడ మీకు అవసరమైన ఆర్కిటెక్చర్ మాత్రమే బిల్డ్ అయ్యేలా సెట్ చేశాం
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        // ఈ కింది లైన్ కొత్తగా యాడ్ చేయండి
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // CMakeLists.txt ఎక్కడ ఉందో దారి (path) చూపించడానికి ఈ బ్లాక్ తప్పనిసరి
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt" // మీ CMakeLists.txt ఎక్కడుందో దాన్ని బట్టి ఈ పాత్ మారుతుంది
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    
    implementation 'com.github.pedroSG94.RootEncoder:library:2.5.9'
    // implementation 'com.github.jiangdongguo.AndroidUSBCamera:libausbc:2.3.5'
}
