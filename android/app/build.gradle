plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-plugin-loader"
}

android {
    namespace "com.kingjvk.pocket_pcr" 
    compileSdk 34 
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId "com.kingjvk.pocket_pcr" 
        minSdk 24
        targetSdk 34 
        versionCode flutter.versionCode.toInteger()
        versionName flutter.versionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    
    // USB UVC Camera Support Library
    implementation 'com.github.jiangdongguo.AndroidUSBCamera:libausbc:2.3.6'
    
    // RTMP లైవ్ స్ట్రీమింగ్ కోసం
    implementation 'com.github.pedroSG94.rtmp-rtsp-stream-client-java:rtplibrary:2.2.2'
}
